<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6af5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#grad)"/>
  <!-- Target/crosshair icon (simplified) -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="6"/>
  <circle cx="50" cy="50" r="14" fill="none" stroke="white" stroke-width="5"/>
  <circle cx="50" cy="50" r="4" fill="white"/>
  <!-- Crosshair lines -->
  <line x1="50" y1="16" x2="50" y2="26" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="74" x2="50" y2="84" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="26" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="74" y1="50" x2="84" y2="50" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
