<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1623;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6af5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6af5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Glow orb -->
  <circle cx="950" cy="315" r="280" fill="url(#accent)" fill-opacity="0.06"/>
  <circle cx="950" cy="315" r="180" fill="url(#accent)" fill-opacity="0.05"/>

  <!-- Logo icon -->
  <rect x="80" y="180" width="80" height="80" rx="18" fill="url(#accent)"/>
  <circle cx="120" cy="220" r="22" fill="none" stroke="white" stroke-width="5"/>
  <circle cx="120" cy="220" r="11" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="120" cy="220" r="3.5" fill="white"/>
  <line x1="120" y1="192" x2="120" y2="200" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="240" x2="120" y2="248" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="92" y1="220" x2="100" y2="220" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="220" x2="148" y2="220" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="176" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Debate</text>
  <text x="176" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">
    <tspan fill="white">Debate</tspan><tspan fill="url(#textGrad)">Coach</tspan>
  </text>

  <!-- Tagline badge -->
  <rect x="80" y="296" width="200" height="30" rx="15" fill="#4f8ef7" fill-opacity="0.15"/>
  <rect x="80" y="296" width="200" height="30" rx="15" fill="none" stroke="#4f8ef7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="180" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#4f8ef7" text-anchor="middle" letter-spacing="1.5">AI DEBATE TRAINING</text>

  <!-- Main headline -->
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white">Sharpen your argument.</text>
  <text x="80" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)">Own the room.</text>

  <!-- Sub-copy -->
  <text x="80" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8899aa">Prepare · Practice · Improve · Win debates with AI coaching</text>

  <!-- Right side decorative target -->
  <circle cx="1000" cy="315" r="160" fill="none" stroke="#4f8ef7" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1000" cy="315" r="100" fill="none" stroke="#4f8ef7" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="1000" cy="315" r="45" fill="none" stroke="#4f8ef7" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="1000" cy="315" r="12" fill="#4f8ef7" fill-opacity="0.3"/>
  <line x1="1000" y1="147" x2="1000" y2="195" stroke="#4f8ef7" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <line x1="1000" y1="435" x2="1000" y2="483" stroke="#4f8ef7" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <line x1="832" y1="315" x2="880" y2="315" stroke="#4f8ef7" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <line x1="1120" y1="315" x2="1168" y2="315" stroke="#4f8ef7" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
</svg>
